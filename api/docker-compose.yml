# LLM-API von aussen: Traefik -> nginx (API-Key) -> meter (Messung) -> Ollama (nativ, GPU)
# Start (im Ordner api/):  docker compose up -d
#   https://ollama-api.oryn.brandadrian.com/v1  und  /api   (R9700, Ollama :11434)
#   https://${OLLAMA_API_2_HOST}/v1 und /api          (RX 7800 XT, Ollama :11435, gleicher Key; Host in .env)
#   https://api.oryn.brandadrian.com/v1                (alt, läuft vorerst parallel)
#   https://ollama.localhost                           (lokal testen)
name: oryn-api

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      # nginx ersetzt ${OLLAMA_API_KEY} beim Start und schreibt nach conf.d/default.conf
      - ./templates:/etc/nginx/templates:ro
    depends_on: [meter, meter2]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.llm-api.loadbalancer.server.port=80
      # nur /v1 und /api; api.oryn ist die alte Adresse (vorerst parallel)
      - traefik.http.routers.llm-api.rule=(Host(`ollama-api.oryn.brandadrian.com`) || Host(`api.oryn.brandadrian.com`)) && (PathPrefix(`/v1`) || PathPrefix(`/api`))
      - traefik.http.routers.llm-api.entrypoints=websecure
      - traefik.http.routers.llm-api.tls.certresolver=le
      - traefik.http.routers.llm-api.service=llm-api
      # zweite Ollama-Instanz (RX 7800 XT, :11435), nginx leitet diesen Host an meter2
      # Hostname aus .env (OLLAMA_API_2_HOST); ohne Wert bricht docker compose ab
      - traefik.http.routers.llm-api-2.rule=Host(`${OLLAMA_API_2_HOST:?OLLAMA_API_2_HOST in .env setzen}`) && (PathPrefix(`/v1`) || PathPrefix(`/api`))
      - traefik.http.routers.llm-api-2.entrypoints=websecure
      - traefik.http.routers.llm-api-2.tls.certresolver=le
      - traefik.http.routers.llm-api-2.service=llm-api
      # lokal (selbstsigniertes Zertifikat)
      - traefik.http.routers.llm-api-local.rule=Host(`ollama.localhost`)
      - traefik.http.routers.llm-api-local.entrypoints=websecure
      - traefik.http.routers.llm-api-local.tls=true
      - traefik.http.routers.llm-api-local.service=llm-api
    networks:
      - proxy
      - default

  # Mess-Proxy: schreibt pro Anfrage Client, Modell, Tokens und Zeiten nach Loki (monitoring/).
  # Keine Traefik-Labels, nur intern erreichbar.
  meter:
    image: node:22-alpine
    restart: unless-stopped
    command: ["node", "/app/server.mjs"]
    volumes:
      - ./meter:/app:ro
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - LOKI_URL=http://host.docker.internal:3100
    # lokal für Programme auf dem PC (z.B. opencode), statt direkt auf :11434 -> wird gemessen
    ports:
      - 127.0.0.1:11444:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    # Port 8081: für Open WebUI chat.oryn direkt (ohne nginx/Key), Client in Grafana "chat-oryn"
    networks:
      default:
      proxy:
        aliases: [meter-openwebui]

  # wie meter, aber für die zweite Ollama-Instanz (RX 7800 XT, scripts/ollama-gpu.ps1 -Mode split)
  meter2:
    image: node:22-alpine
    restart: unless-stopped
    command: ["node", "/app/server.mjs"]
    volumes:
      - ./meter:/app:ro
    environment:
      - OLLAMA_URL=http://host.docker.internal:11435
      - LOKI_URL=http://host.docker.internal:3100
      - METER_GPU=rx7800
    ports:
      - 127.0.0.1:11445:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      default:
      proxy:
        aliases: [meter-openwebui-scout]

networks:
  proxy:
    external: true
