# Monitoring des LLM-Gateways: Prometheus + Loki + Grafana
# Start (im Ordner monitoring/):  docker compose up -d
# Grafana: https://monitoring.oryn.brandadrian.com/monitor (öffentlich, nur lesen), lokal http://localhost:3000/monitor
name: oryn-monitoring
#
# Daten liegen in ./data/ neben dieser Datei (einfach zu sichern, z.B. mit Hyper Backup).

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: ollama-prometheus
    restart: unless-stopped
    user: "0:0"   # vermeidet Rechteprobleme mit Bind-Mounts (z.B. auf Synology)
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=365d     # 1 Jahr aufbewahren
      - --storage.tsdb.retention.size=10GB     # oder max. 10 GB, was zuerst eintritt
      - --web.enable-otlp-receiver             # OTLP-Endpunkt: /api/v1/otlp/v1/metrics
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus

  loki:
    image: grafana/loki:latest
    container_name: ollama-loki
    restart: unless-stopped
    user: "0:0"
    command:
      - -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"   # Push-API: /loki/api/v1/push
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ./data/loki:/loki

  grafana:
    image: grafana/grafana:latest
    container_name: ollama-grafana
    restart: unless-stopped
    user: "0:0"
    depends_on: [prometheus, loki]
    ports:
      - "3000:3000"   # lokal: http://localhost:3000/monitor (Admin-Login nur hier)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Grafana läuft unter /monitor, damit /v1 und /api auf derselben Domain der LLM-API gehören
      - GF_SERVER_ROOT_URL=https://monitoring.oryn.brandadrian.com/monitor/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # Besucher: anonym, nur lesen. Öffentlich blockiert Traefik Login/Admin und entfernt Authorization/Cookie-Header.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_ANONYMOUS_HIDE_VERSION=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/ollama.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./data/grafana:/var/lib/grafana
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.llm-monitor.loadbalancer.server.port=3000
      - traefik.http.middlewares.llm-monitor-anon.headers.customrequestheaders.Authorization=
      - traefik.http.middlewares.llm-monitor-anon.headers.customrequestheaders.Cookie=
      - traefik.http.middlewares.llm-monitor-to-subpath.redirectregex.regex=^https://([^/]+)/(.*)
      - traefik.http.middlewares.llm-monitor-to-subpath.redirectregex.replacement=https://$${1}/monitor/$${2}
      # neu: https://monitoring.oryn.brandadrian.com/monitor  (/ leitet dorthin)
      - traefik.http.routers.llm-monitor.rule=Host(`monitoring.oryn.brandadrian.com`) && PathPrefix(`/monitor`) && !PathPrefix(`/monitor/login`) && !PathPrefix(`/monitor/logout`) && !PathPrefix(`/monitor/signup`) && !PathPrefix(`/monitor/user`) && !PathPrefix(`/monitor/admin`)
      - traefik.http.routers.llm-monitor.entrypoints=websecure
      - traefik.http.routers.llm-monitor.tls.certresolver=le
      - traefik.http.routers.llm-monitor.service=llm-monitor
      - traefik.http.routers.llm-monitor.middlewares=llm-monitor-anon
      - traefik.http.routers.llm-monitor-root.rule=Host(`monitoring.oryn.brandadrian.com`) && Path(`/`)
      - traefik.http.routers.llm-monitor-root.entrypoints=websecure
      - traefik.http.routers.llm-monitor-root.tls.certresolver=le
      - traefik.http.routers.llm-monitor-root.service=noop@internal
      - traefik.http.routers.llm-monitor-root.middlewares=llm-monitor-to-subpath
      # alt (läuft vorerst parallel): https://ollama-monitoring.homelab.brandadrian.com
      - traefik.http.routers.llm-monitor-old.rule=(Host(`ollama-monitoring.homelab.brandadrian.com`) || Host(`ollama-monitoring.localhost`)) && PathPrefix(`/monitor`) && !PathPrefix(`/monitor/login`) && !PathPrefix(`/monitor/logout`) && !PathPrefix(`/monitor/signup`) && !PathPrefix(`/monitor/user`) && !PathPrefix(`/monitor/admin`)
      - traefik.http.routers.llm-monitor-old.entrypoints=websecure
      - traefik.http.routers.llm-monitor-old.tls=true
      - traefik.http.routers.llm-monitor-old.tls.certresolver=le
      - traefik.http.routers.llm-monitor-old.service=llm-monitor
      - traefik.http.routers.llm-monitor-old.middlewares=llm-monitor-anon
      - traefik.http.routers.llm-monitor-old-root.rule=(Host(`ollama-monitoring.homelab.brandadrian.com`) || Host(`ollama-monitoring.localhost`)) && !PathPrefix(`/monitor`)
      - traefik.http.routers.llm-monitor-old-root.entrypoints=websecure
      - traefik.http.routers.llm-monitor-old-root.tls=true
      - traefik.http.routers.llm-monitor-old-root.service=noop@internal
      - traefik.http.routers.llm-monitor-old-root.middlewares=llm-monitor-to-subpath
    networks:
      - default
      - proxy

  # Optional: OllamaMonitor im Container (nur Tokens/Modelle, ohne CPU/RAM/GPU).
  # Standard ist der native Windows-Dienst (siehe README). Starten nur mit: docker compose --profile container-monitor up -d
  monitor:
    build: ../ollama-monitor
    profiles: [container-monitor]
    container_name: ollama-monitor
    restart: unless-stopped
    hostname: ${COMPUTERNAME:-ollama-pc}   # wird zum Label "instance" im Dashboard
    depends_on: [prometheus, loki]
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - UseOtel=true
      - Monitor__OllamaUrl=http://host.docker.internal:11434
      - Monitor__LogPath=/ollama-logs/server.log
      - LocalPrometheus__OtlpEndpoint=http://prometheus:9090/api/v1/otlp
      - Loki__Url=http://loki:3100
    volumes:
      # Ollama-Logordner von Windows, nur lesen
      - ${LOCALAPPDATA}/Ollama:/ollama-logs:ro

networks:
  proxy:
    external: true
