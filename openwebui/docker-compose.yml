# Open WebUI: Chat und Modellverwaltung mit Login (Ollama nativ auf dem PC).
# Start (im Ordner openwebui/):  docker compose up -d
#   https://chat.oryn.brandadrian.com   https://openwebui.localhost (lokal)
# Projektname fest auf "openwebui": nutzt weiter das bestehende Volume openwebui_data (Benutzer, Chats).
name: openwebui

services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.13.4
    restart: unless-stopped
    env_file: .env
    environment:
      - OLLAMA_BASE_URL=http://meter-openwebui:8081   # über Mess-Proxy (api/), damit Grafana es sieht
      - WEBUI_URL=https://chat.oryn.brandadrian.com
      - CORS_ALLOW_ORIGIN=https://chat.oryn.brandadrian.com;https://openwebui.localhost
      # öffentlich erreichbar: Login an, keine Selbstregistrierung
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=false
    volumes:
      - data:/app/backend/data
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      - traefik.enable=true
      # https://chat.oryn.brandadrian.com
      - traefik.http.routers.openwebui-chat.rule=Host(`chat.oryn.brandadrian.com`)
      - traefik.http.routers.openwebui-chat.entrypoints=websecure
      - traefik.http.routers.openwebui-chat.tls.certresolver=le
      - traefik.http.routers.openwebui-chat.service=openwebui
      # lokal testen: https://openwebui.localhost (selbstsigniertes Zertifikat, kein Let's Encrypt)
      - traefik.http.routers.openwebui-local.rule=Host(`openwebui.localhost`)
      - traefik.http.routers.openwebui-local.entrypoints=websecure
      - traefik.http.routers.openwebui-local.tls=true
      - traefik.http.routers.openwebui-local.service=openwebui
      - traefik.http.services.openwebui.loadbalancer.server.port=8080
    networks:
      - proxy

  # Spielt config.json ein (Verbindungen, Websuche, Tools, Modelle, Standardmodell); läuft bei jedem up einmal
  setup:
    image: ghcr.io/open-webui/open-webui:v0.13.4
    restart: "no"
    env_file: .env   # Geheimnisse für ${NAME} in config.json
    depends_on: [openwebui]
    entrypoint: ["python3", "/setup.py"]
    environment:
      - WEBUI_INTERNAL_URL=http://openwebui:8080
      - ADMIN_EMAIL=${WEBUI_ADMIN_EMAIL}
      - ADMIN_PASSWORD=${WEBUI_ADMIN_PASSWORD}
      - ADMIN_TOKEN=${WEBUI_ADMIN_TOKEN:-}
    volumes:
      - ./setup.py:/setup.py:ro
      - ./config.json:/config.json:ro
    networks:
      - proxy

volumes:
  data:
    external: true
    name: openwebui_data   # bestehendes Volume (Benutzer, Chats), stammt aus dem früheren homelab-proxy

networks:
  proxy:
    external: true
