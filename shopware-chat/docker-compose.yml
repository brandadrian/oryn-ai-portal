# Separates Open WebUI mit Shopware-MCP (Admin + optional ein einfacher Benutzer, alles vorkonfiguriert).
# Eigenes Projekt, eigenes Volume, eigene Domain: das bestehende Open WebUI (openwebui/) bleibt unberührt.
#
# Pro Instanz eine Env-Datei, alles kommt aus dieser Datei:
#   docker compose --env-file .env.staging up -d
#   docker compose --env-file .env.production up -d
#   docker compose --env-file .env.geschenkkoerbe up -d
#
# Shopware-MCP: @shopware-ag/admin-mcp (Admin API, läuft auch mit Shopware 6.6) hinter mcpo (MCP -> OpenAPI),
# Anmeldung über eine Shopware-Integration. Der MCP-Container ist nur im internen Netz des Projekts erreichbar.
name: shopware-chat-${APP_ENV:?APP_ENV setzen (z.B. staging, production, geschenkkoerbe)}

services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.13.4
    restart: unless-stopped
    environment:
      WEBUI_NAME: ${WEBUI_NAME:-Shopware Chat (${APP_ENV})}
      WEBUI_URL: https://${WEBUI_HOST:?WEBUI_HOST setzen}
      CORS_ALLOW_ORIGIN: https://${WEBUI_HOST}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY setzen}

      # Admin wird beim ersten Start angelegt (nur wenn noch keiner existiert), keine Registrierung.
      # Optionaler einfacher Benutzer: siehe Dienst user-init.
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: "false"
      WEBUI_ADMIN_NAME: ${WEBUI_ADMIN_NAME:-Shopware}
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:?WEBUI_ADMIN_EMAIL setzen}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:?WEBUI_ADMIN_PASSWORD setzen}

      # Konfiguration immer aus der Env-Datei, nicht aus der Datenbank (Änderungen im Admin-Menü gehen beim Neustart verloren).
      ENABLE_PERSISTENT_CONFIG: "false"

      # Modelle: Ollama auf dem Host und/oder OpenAI
      ENABLE_OLLAMA_API: ${ENABLE_OLLAMA:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ENABLE_OPENAI_API: ${ENABLE_OPENAI:-false}
      OPENAI_API_BASE_URL: https://api.openai.com/v1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # bei OpenAI nur das Standardmodell anbieten statt der ganzen Modellliste
      # api_type "responses" = Responses API (neuere OpenAI-Modelle können Tool-Aufrufe nur darüber)
      OPENAI_API_CONFIGS: '{"0":{"enable":true,"api_type":"${OPENAI_API_TYPE:-responses}","model_ids":["${DEFAULT_MODEL:-qwen3.8:27b}"]}}'
      DEFAULT_MODELS: ${DEFAULT_MODEL:-qwen3.8:27b}
      DEFAULT_PINNED_MODELS: ${DEFAULT_MODEL:-qwen3.8:27b}
      # true = auch einfache Benutzer sehen die angebotenen Modelle (ohne Freigabe pro Modell)
      BYPASS_MODEL_ACCESS_CONTROL: ${BYPASS_MODEL_ACCESS_CONTROL:-false}

      # Einfache Benutzer: nur chatten, möglichst wenig Einstellungen (Admins betrifft das nicht)
      USER_PERMISSIONS_CHAT_CONTROLS: "false"
      USER_PERMISSIONS_CHAT_VALVES: "false"
      USER_PERMISSIONS_CHAT_SYSTEM_PROMPT: "false"
      USER_PERMISSIONS_CHAT_PARAMS: "false"
      USER_PERMISSIONS_CHAT_MULTIPLE_MODELS: "false"
      USER_PERMISSIONS_CHAT_TEMPORARY: "false"
      USER_PERMISSIONS_CHAT_SHARE: "false"
      USER_PERMISSIONS_CHAT_IMPORT: "false"
      USER_PERMISSIONS_CHAT_CALL: "false"
      USER_PERMISSIONS_FEATURES_WEB_SEARCH: "false"
      USER_PERMISSIONS_FEATURES_IMAGE_GENERATION: "false"
      USER_PERMISSIONS_FEATURES_CODE_INTERPRETER: "false"
      USER_PERMISSIONS_FEATURES_NOTES: "false"
      USER_PERMISSIONS_FEATURES_CHANNELS: "false"
      USER_PERMISSIONS_FEATURES_MEMORIES: "false"
      USER_PERMISSIONS_FEATURES_SUBAGENTS: "false"
      USER_PERMISSIONS_FEATURES_CALENDAR: "false"
      USER_PERMISSIONS_SETTINGS_INTERFACE: "false"
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_MESSAGE_RATING: "false"

      # Shopware-MCP (über mcpo) als Tool-Server, für alle Benutzer, bei jedem Modell standardmäßig eingeschaltet
      TOOL_SERVER_CONNECTIONS: >-
        [{"type":"openapi","url":"http://shopware-mcp:8000","path":"openapi.json","auth_type":"bearer","key":"${MCPO_API_KEY:?MCPO_API_KEY setzen}",
        "config":{"enable":true,"access_grants":[{"principal_type":"user","principal_id":"*","permission":"read"}]},
        "info":{"id":"shopware","name":"Shopware ${APP_ENV}","description":"Shopware Admin API (${SHOPWARE_URL:?SHOPWARE_URL setzen})"}}]
      DEFAULT_MODEL_METADATA: '{"toolIds":["server:shopware"]}'
      # Systemprompt: Abfragen klein halten, damit Tool-Antworten nicht riesig werden
      DEFAULT_MODEL_PARAMS: >-
        {"function_calling":"native",
        "system":"Du bist ein Assistent fuer den Shopware-Shop und nutzt dafuer das Shopware-Tool. Lade immer nur so wenig Daten wie fuer die Frage noetig. Jede Abfrage mit filter eingrenzen, vor allem nach Zeitraum (orderDateTime range): zuerst einen kleinen Zeitraum, z.B. den letzten Monat, und nur wenn noetig erweitern. Lieber zaehlen (count, sum) als Listen laden. Listen seitenweise und nur die erste Seite, ausser der Benutzer will mehr. Kommt der Fehler ergebnis_zu_gross, die Abfrage enger fassen, nie Zahlen schaetzen. Sag dem Benutzer kurz, auf welchen Zeitraum sich die Zahlen beziehen. Antworte kurz und auf Deutsch."}
    volumes:
      - data:/app/backend/data
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.shopware-chat-${APP_ENV}.rule=Host(`${WEBUI_HOST}`)
      - traefik.http.routers.shopware-chat-${APP_ENV}.entrypoints=websecure
      - traefik.http.routers.shopware-chat-${APP_ENV}.tls.certresolver=le
      - traefik.http.routers.shopware-chat-${APP_ENV}.service=shopware-chat-${APP_ENV}
      - traefik.http.services.shopware-chat-${APP_ENV}.loadbalancer.server.port=8080
    depends_on:
      - shopware-mcp
    networks:
      - default
      - proxy

  shopware-mcp:
    image: ghcr.io/open-webui/mcpo:main
    restart: unless-stopped
    environment:
      SHOPWARE_API_URL: ${SHOPWARE_URL}
      SHOPWARE_API_CLIENT_ID: ${SHOPWARE_CLIENT_ID:?SHOPWARE_CLIENT_ID setzen}
      SHOPWARE_API_CLIENT_SECRET: ${SHOPWARE_CLIENT_SECRET:?SHOPWARE_CLIENT_SECRET setzen}
      MCPO_KEY: ${MCPO_API_KEY}
      # Tool-Antworten werden verlustfrei kompakt gemacht; ist es danach noch größer als das, gibt es einen Fehler statt Teil-Daten
      MAX_TOOL_RESULT_CHARS: ${MAX_TOOL_RESULT_CHARS:-100000}
    # mcpo intern auf 8001, davor limit-proxy.py auf 8000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mcpo --host 127.0.0.1 --port 8001 --api-key "$$MCPO_KEY" -- npx -y @shopware-ag/admin-mcp@0.1.1 &
        exec python /limit-proxy.py
    volumes:
      - npm-cache:/root/.npm
      - ./limit-proxy.py:/limit-proxy.py:ro
    networks:
      - default

  # Legt nach dem Start einmalig den einfachen Benutzer an (über die Admin-API), falls CHAT_USER_EMAIL gesetzt ist.
  # Existiert er schon, passiert nichts.
  user-init:
    image: curlimages/curl:8.11.1
    restart: "no"
    depends_on:
      - openwebui
    environment:
      ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD}
      USER_NAME: ${CHAT_USER_NAME:-Benutzer}
      USER_EMAIL: ${CHAT_USER_EMAIL:-}
      USER_PASSWORD: ${CHAT_USER_PASSWORD:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -z "$$USER_EMAIL" ] && { echo "CHAT_USER_EMAIL leer, kein Benutzer angelegt"; exit 0; }
        until curl -sf http://openwebui:8080/health >/dev/null; do sleep 3; done
        TOKEN=$$(curl -sf http://openwebui:8080/api/v1/auths/signin -H 'Content-Type: application/json' \
          -d "{\"email\":\"$$ADMIN_EMAIL\",\"password\":\"$$ADMIN_PASSWORD\"}" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
        [ -z "$$TOKEN" ] && { echo "Admin-Login fehlgeschlagen"; exit 1; }
        RES=$$(curl -s http://openwebui:8080/api/v1/auths/add -H "Authorization: Bearer $$TOKEN" -H 'Content-Type: application/json' \
          -d "{\"name\":\"$$USER_NAME\",\"email\":\"$$USER_EMAIL\",\"password\":\"$$USER_PASSWORD\",\"role\":\"user\"}")
        case "$$RES" in
          *'"role":"user"'*) echo "Benutzer $$USER_EMAIL angelegt" ;;
          *) echo "Benutzer nicht angelegt (existiert evtl. schon): $$(echo "$$RES" | head -c 200)" ;;
        esac
    networks:
      - default

volumes:
  data:
    name: shopware-chat-${APP_ENV}_data
  npm-cache:

networks:
  proxy:
    external: true
