# Local test only: a Loki container instead of the SSH tunnel to Maxcluster.
# docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build loki loki-mcp
services:
  loki:
    image: grafana/loki:3.5.0
    ports:
      - "127.0.0.1:3100:3100"

  loki-mcp:
    environment:
      - LOKI_URL=http://loki:3100
    depends_on:
      - loki
